services:
  backend:
    environment:
      APP_ENV: production
      FRONTEND_ORIGIN: https://docs.localhost:3443
      PUBLIC_APP_URL: https://docs.localhost:3443
      PUBLIC_API_URL: https://docs.localhost:3443
      OFFICE_COLLAB_PUBLIC_URL: wss://docs.localhost:3444/yjs
      CASUAL_DOCS_EDITOR_URL: https://docs.localhost:3445
      CASUAL_SHEETS_EDITOR_URL: https://docs.localhost:3444

  local-https-app:
    image: docker.io/library/nginx:1.27-alpine
    command: /bin/sh -c 'nginx -g "daemon off;" & pid=$$!; sleep 2; nginx -s reload; wait "$$pid"'
    ports:
      - "3443:443"
    volumes:
      - ./nginx/nginx.local-https.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./certs/local:/etc/nginx/tls:ro,Z
    depends_on:
      - backend
      - frontend

  local-https-sheets:
    image: docker.io/library/nginx:1.27-alpine
    command: /bin/sh -c 'nginx -g "daemon off;" & pid=$$!; sleep 2; nginx -s reload; wait "$$pid"'
    ports:
      - "3444:443"
    volumes:
      - ./casual-gateway/sheets.local-https.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./casual-gateway/zh-CN.js:/etc/nginx/casual-zh-CN.js:ro,z
      - ./certs/local:/etc/nginx/tls:ro,Z
    depends_on:
      - backend
      - office-collab

  local-https-docs:
    image: docker.io/library/nginx:1.27-alpine
    command: /bin/sh -c 'nginx -g "daemon off;" & pid=$$!; sleep 2; nginx -s reload; wait "$$pid"'
    ports:
      - "3445:443"
    volumes:
      - ./casual-gateway/docs.local-https.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./casual-gateway/zh-CN.js:/etc/nginx/casual-zh-CN.js:ro,z
      - ./certs/local:/etc/nginx/tls:ro,Z
    depends_on:
      - backend
      - casual-docs
