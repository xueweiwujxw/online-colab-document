server {
    listen 443 ssl;
    server_name docs.localhost;

    ssl_certificate /etc/nginx/tls/local.crt;
    ssl_certificate_key /etc/nginx/tls/local.key;
    client_max_body_size 50m;
    access_log off;

    location = /casual-zh-CN.js {
        alias /etc/nginx/casual-zh-CN.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location /wopi/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /yjs {
        proxy_pass http://backend:8080/casual/sheets/yjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/api/rooms/([^/]+)/(info|seed)$ {
        rewrite ^/api/rooms/([^/]+)/(info|seed)$ /casual/sheets/rooms/$1/$2 break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://office-collab:3000;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        sub_filter_once on;
        sub_filter '</head>' '<script defer src="/casual-zh-CN.js"></script></head>';
    }
}
