server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    access_log off;

    location = /casual-zh-CN.js {
        alias /etc/nginx/casual-zh-CN.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location /wopi/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /yjs {
        proxy_pass http://backend:8080/casual/docs/yjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/api/rooms/([^/]+)/seed$ {
        rewrite ^/api/rooms/([^/]+)/seed$ /casual/docs/rooms/$1/seed break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://casual-docs:3000;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        sub_filter_once on;
        sub_filter '</head>' '<script defer src="/casual-zh-CN.js"></script></head>';
    }
}
