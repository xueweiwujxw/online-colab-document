services:
  backend:
    build:
      context: ../backend
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://docs:docs@postgres:5432/docs?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: docs
      S3_USE_SSL: "false"
      FRONTEND_ORIGIN: http://localhost:3000
      SESSION_COOKIE_NAME: docs_session
      SESSION_TTL_HOURS: "168"
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://mock-oidc:8080/realms/docs-collab}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-docs-collab}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-docs-collab-secret}
      OIDC_REDIRECT_URL: http://localhost:8080/api/auth/oidc/callback
      OIDC_SCOPES: openid,email,profile
      OIDC_AUTO_MERGE_BY_EMAIL: "false"
      DOCUMENT_MAX_UPLOAD_BYTES: "52428800"
      OFFICE_COLLAB_ENABLED: ${OFFICE_COLLAB_ENABLED:-true}
      OFFICE_COLLAB_PUBLIC_URL: ${OFFICE_COLLAB_PUBLIC_URL:-ws://localhost:1234}
      CASUAL_JWT_SECRET: ${CASUAL_JWT_SECRET:?set CASUAL_JWT_SECRET in an ignored env file}
      CASUAL_DOCS_EDITOR_URL: ${CASUAL_DOCS_EDITOR_URL:-http://localhost:1235}
      CASUAL_SHEETS_EDITOR_URL: ${CASUAL_SHEETS_EDITOR_URL:-http://localhost:1234}
      CASUAL_SHEETS_INTERNAL_WS_URL: ws://office-collab:3000/yjs
      CASUAL_DOCS_INTERNAL_WS_URL: ws://casual-docs:3000/yjs
      PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:8080
      BACKEND_INTERNAL_URL: http://backend:8080
      MARKDOWN_SNAPSHOT_UPDATE_INTERVAL: "100"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ""
    environment:
      API_PROXY_TARGET: http://backend:8080
      OFFICE_COLLAB_PROXY_HOST: office-collab
      OFFICE_COLLAB_PROXY_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - office-collab

  office-collab:
    build:
      context: ./casual-sheets
    image: local/casualoffice-sheets:0.3.4-patched
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      CASUAL_REDIS_PREFIX: "online-colab-document:"
    depends_on:
      - redis

  casual-docs:
    build:
      context: ./casual-docs
    image: local/casualoffice-docs-wopi:0.0.5-patched
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      CASUAL_REDIS_PREFIX: "online-colab-document:docs:"
      CASUAL_FILE_EXT: ".docx"
    depends_on:
      - redis

  casual-sheets-gateway:
    image: docker.io/library/nginx:1.27-alpine
    command: /bin/sh -c 'nginx -g "daemon off;" & pid=$$!; sleep 2; nginx -s reload; wait "$$pid"'
    ports:
      - "1234:80"
    volumes:
      - ./casual-gateway/sheets.conf:/etc/nginx/conf.d/default.conf:ro,Z
      # 这份资源由两个网关共同读取；使用共享 SELinux 标签，不能用私有 Z 标签。
      - ./casual-gateway/zh-CN.js:/etc/nginx/casual-zh-CN.js:ro,z
    depends_on:
      - backend
      - office-collab

  casual-docs-gateway:
    image: docker.io/library/nginx:1.27-alpine
    command: /bin/sh -c 'nginx -g "daemon off;" & pid=$$!; sleep 2; nginx -s reload; wait "$$pid"'
    ports:
      - "1235:80"
    volumes:
      - ./casual-gateway/docs.conf:/etc/nginx/conf.d/default.conf:ro,Z
      # 这份资源由两个网关共同读取；使用共享 SELinux 标签，不能用私有 Z 标签。
      - ./casual-gateway/zh-CN.js:/etc/nginx/casual-zh-CN.js:ro,z
    depends_on:
      - backend
      - casual-docs

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: docs
      POSTGRES_USER: docs
      POSTGRES_PASSWORD: docs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:8-alpine
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    profiles:
      - proxy
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  mock-oidc:
    build:
      context: ./mock-oidc
    profiles:
      - oidc
    environment:
      OIDC_ISSUER: http://mock-oidc:8080/realms/docs-collab
      OIDC_PUBLIC_BASE: http://localhost:8082/realms/docs-collab
      OIDC_CLIENT_ID: docs-collab
      OIDC_CLIENT_SECRET: docs-collab-secret
    ports:
      - "8082:8080"

volumes:
  postgres-data:
  minio-data:
