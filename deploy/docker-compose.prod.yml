services:
  backend:
    build:
      context: ../backend
    env_file:
      - ./env/app.env.example
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-docs}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-docs}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-docs}
      S3_USE_SSL: "false"
      FRONTEND_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:8088}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8088}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8088}
      BACKEND_INTERNAL_URL: http://backend:8080
      OFFICE_COLLAB_ENABLED: ${OFFICE_COLLAB_ENABLED:-true}
      OFFICE_COLLAB_PUBLIC_URL: ${OFFICE_COLLAB_PUBLIC_URL:-ws://localhost:8088/office-collab}
      PASSWORD_HASH_PEPPER: ${SESSION_SECRET:-change-me}
      DOCUMENT_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      CASUAL_JWT_SECRET: ${CASUAL_JWT_SECRET:?set CASUAL_JWT_SECRET in the production env file}
      CASUAL_DOCS_EDITOR_URL: ${CASUAL_DOCS_EDITOR_URL:?set CASUAL_DOCS_EDITOR_URL in the production env file}
      CASUAL_SHEETS_EDITOR_URL: ${CASUAL_SHEETS_EDITOR_URL:?set CASUAL_SHEETS_EDITOR_URL in the production env file}
      CASUAL_DOCS_INTERNAL_WS_URL: ${CASUAL_DOCS_INTERNAL_WS_URL:-ws://casual-docs:3000/yjs}
      CASUAL_SHEETS_INTERNAL_WS_URL: ${CASUAL_SHEETS_INTERNAL_WS_URL:-ws://office-collab:3000/yjs}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8088}
    environment:
      PORT: "3000"
    depends_on:
      - backend
    restart: unless-stopped

  office-collab:
    build:
      context: ./casual-sheets
    image: local/casualoffice-sheets:0.3.4-patched
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      CASUAL_REDIS_PREFIX: "online-colab-document:"
    depends_on:
      - redis
    restart: unless-stopped

  casual-docs:
    build:
      context: ./casual-docs
    image: local/casualoffice-docs-wopi:0.0.5-patched
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      CASUAL_REDIS_PREFIX: "online-colab-document:docs:"
      CASUAL_FILE_EXT: ".docx"
    depends_on:
      - redis
    restart: unless-stopped

  casual-sheets-gateway:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${CASUAL_SHEETS_HTTP_PORT:-1234}:80"
    volumes:
      - ./casual-gateway/sheets.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./casual-gateway/zh-CN.js:/etc/nginx/casual-zh-CN.js:ro,z
    depends_on:
      - backend
      - office-collab
    restart: unless-stopped

  casual-docs-gateway:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${CASUAL_DOCS_HTTP_PORT:-1235}:80"
    volumes:
      - ./casual-gateway/docs.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./casual-gateway/zh-CN.js:/etc/nginx/casual-zh-CN.js:ro,z
    depends_on:
      - backend
      - casual-docs
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - frontend
      - backend
      - office-collab
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docs}
      POSTGRES_USER: ${POSTGRES_USER:-docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
