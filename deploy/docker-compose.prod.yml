services:
  backend:
    build:
      context: ../backend
    env_file:
      - ./env/app.env.example
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-docs}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-docs}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-docs}
      S3_USE_SSL: "false"
      FRONTEND_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:8088}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8088}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8088}
      BACKEND_INTERNAL_URL: http://backend:8080
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:8088/onlyoffice}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me}
      PASSWORD_HASH_PEPPER: ${SESSION_SECRET:-change-me}
      DOCUMENT_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      onlyoffice:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8088}
    environment:
      PORT: "3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - onlyoffice
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docs}
      POSTGRES_USER: ${POSTGRES_USER:-docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  onlyoffice:
    image: docker.io/onlyoffice/documentserver:latest
    environment:
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
