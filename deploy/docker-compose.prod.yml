services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in the production env file}
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-docs}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-docs}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-docs}
      S3_USE_SSL: "false"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in the production env file}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL in the production env file}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in the production env file}
      BACKEND_INTERNAL_URL: http://backend:8080
      OFFICE_COLLAB_ENABLED: ${OFFICE_COLLAB_ENABLED:-true}
      OFFICE_COLLAB_PUBLIC_URL: ${OFFICE_COLLAB_PUBLIC_URL:?set OFFICE_COLLAB_PUBLIC_URL in the production env file}
      PASSWORD_HASH_PEPPER: ${SESSION_SECRET:-change-me}
      DOCUMENT_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      CASUAL_JWT_SECRET: ${CASUAL_JWT_SECRET:?set CASUAL_JWT_SECRET in the production env file}
      CASUAL_DOCS_EDITOR_URL: ${CASUAL_DOCS_EDITOR_URL:?set CASUAL_DOCS_EDITOR_URL in the production env file}
      CASUAL_SHEETS_EDITOR_URL: ${CASUAL_SHEETS_EDITOR_URL:?set CASUAL_SHEETS_EDITOR_URL in the production env file}
      CASUAL_DOCS_INTERNAL_WS_URL: ${CASUAL_DOCS_INTERNAL_WS_URL:-ws://casual-docs:3000/yjs}
      CASUAL_SHEETS_INTERNAL_WS_URL: ${CASUAL_SHEETS_INTERNAL_WS_URL:-ws://office-collab:3000/yjs}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-docs_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,email,profile}
      OIDC_AUTO_MERGE_BY_EMAIL: ${OIDC_AUTO_MERGE_BY_EMAIL:-false}
      MARKDOWN_SNAPSHOT_UPDATE_INTERVAL: ${MARKDOWN_SNAPSHOT_UPDATE_INTERVAL:-100}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE in the production env file}
    depends_on:
      - backend
    restart: unless-stopped

  office-collab:
    image: ${CASUAL_SHEETS_IMAGE:?set CASUAL_SHEETS_IMAGE in the production env file}
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      CASUAL_REDIS_PREFIX: "online-colab-document:"
    depends_on:
      - redis
    restart: unless-stopped

  casual-docs:
    image: ${CASUAL_DOCS_IMAGE:?set CASUAL_DOCS_IMAGE in the production env file}
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      CASUAL_REDIS_PREFIX: "online-colab-document:docs:"
      CASUAL_FILE_EXT: ".docx"
    depends_on:
      - redis
    restart: unless-stopped

  casual-sheets-gateway:
    image: docker.io/library/nginx:1.27-alpine
    command: /bin/sh -c 'nginx -g "daemon off;" & pid=$$!; sleep 2; nginx -s reload; wait "$$pid"'
    ports:
      - "${CASUAL_SHEETS_HTTPS_PORT:-8444}:443"
    volumes:
      - ./casual-gateway/sheets.prod-https.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./casual-gateway/zh-CN.js:/etc/nginx/casual-zh-CN.js:ro,z
      - ${TLS_CERT_FILE:?set TLS_CERT_FILE in the production env file}:/etc/nginx/tls/tls.crt:ro,Z
      - ${TLS_KEY_FILE:?set TLS_KEY_FILE in the production env file}:/etc/nginx/tls/tls.key:ro,Z
    depends_on:
      - backend
      - office-collab
    restart: unless-stopped

  casual-docs-gateway:
    image: docker.io/library/nginx:1.27-alpine
    command: /bin/sh -c 'nginx -g "daemon off;" & pid=$$!; sleep 2; nginx -s reload; wait "$$pid"'
    ports:
      - "${CASUAL_DOCS_HTTPS_PORT:-8445}:443"
    volumes:
      - ./casual-gateway/docs.prod-https.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./casual-gateway/zh-CN.js:/etc/nginx/casual-zh-CN.js:ro,z
      - ${TLS_CERT_FILE:?set TLS_CERT_FILE in the production env file}:/etc/nginx/tls/tls.crt:ro,Z
      - ${TLS_KEY_FILE:?set TLS_KEY_FILE in the production env file}:/etc/nginx/tls/tls.key:ro,Z
    depends_on:
      - backend
      - casual-docs
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.prod-https.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ${TLS_CERT_FILE:?set TLS_CERT_FILE in the production env file}:/etc/nginx/tls/tls.crt:ro,Z
      - ${TLS_KEY_FILE:?set TLS_KEY_FILE in the production env file}:/etc/nginx/tls/tls.key:ro,Z
    depends_on:
      - frontend
      - backend
      - office-collab
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docs}
      POSTGRES_USER: ${POSTGRES_USER:-docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
